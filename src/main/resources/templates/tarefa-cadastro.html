<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Tarefa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 th:text="${tarefa.id == null ? 'Nova Tarefa' : 'Editar Tarefa'}"></h1>

    <form th:action="@{/tarefas/salvar}" th:object="${tarefa}" method="post" class="mt-4">
        <input type="hidden" th:field="*{id}">
        
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" th:field="*{titulo}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea th:field="*{descricao}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Data (dd/mm/aaaa)</label>
            <input type="text" th:field="*{data}" class="form-control" placeholder="Ex: 27/04/2026" required>
        </div>

        <div class="mb-3" th:if="${tarefa.id != null}">
            <label class="form-label">Status</label>
            <select th:field="*{status}" class="form-select">
                <option th:each="status : ${T(com.example.todolist.enums.TarefaStatus).values()}" 
                        th:value="${status}" 
                        th:text="${status.descricao}"></option>
            </select>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a th:href="@{/tarefas}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</body>
</html>
