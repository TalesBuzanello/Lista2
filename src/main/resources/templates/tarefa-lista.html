<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Minhas Tarefas</h1>
        <a th:href="@{/tarefas/cadastrar}" class="btn btn-primary">Nova Tarefa</a>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Data</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tarefa : ${tarefas}">
                <td th:text="${tarefa.id}"></td>
                <td th:text="${tarefa.titulo}"></td>
                <td th:text="${#temporals.format(tarefa.data, 'dd/MM/yyyy')}"></td>
                <td>
                    <span class="badge" 
                          th:classappend="${tarefa.status.name() == 'EM_ANDAMENTO' ? 'bg-warning' : (tarefa.status.name() == 'CONCLUIDO' ? 'bg-success' : 'bg-danger')}"
                          th:text="${tarefa.status.descricao}"></span>
                </td>
                <td>
                    <a th:href="@{/tarefas/editar/{id}(id=${tarefa.id})}" class="btn btn-sm btn-secondary">Editar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tarefas)}">
                <td colspan="5" class="text-center">Nenhuma tarefa cadastrada.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
